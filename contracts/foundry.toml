[profile.default]
src = "src"
out = "out"
libs = ["lib"]
metadata = true
metadata_hash = "none"  # disable ipfs
use_literal_content = true # use source code

# Monad Configuration
eth-rpc-url="https://testnet-rpc.monad.xyz"
chain_id = 10143

# Solidity compiler version
solc = "0.8.24"

# Gas settings
gas_price = 1000000000  # 1 gwei
gas_limit = 30000000

# Test settings
fuzz = { runs = 1000 }
invariant = { runs = 256, depth = 15 }

# Optimizer settings
optimizer = true
optimizer_runs = 200
via_ir = true

# Verbose output
verbosity = 2